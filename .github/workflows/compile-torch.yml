name: Build Minimal LibTorch (Windows CPU)

# 手动触发: 在 GitHub 仓库 -> Actions -> 选择本工作流 -> Run workflow
on:
  workflow_dispatch:
    inputs:
      pytorch_ref:
        description: "PyTorch 版本 tag (与本地保持一致建议 v2.4.1)"
        required: true
        default: "v2.4.1"

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 360
    env:
      # ---- 只保留训练必需, 关掉所有用不到的后端, 缩小 torch_cpu.dll ----
      USE_CUDA: "0"
      USE_ROCM: "0"
      USE_DISTRIBUTED: "0"    # 去掉 uv.dll / gloo / c10d
      USE_FBGEMM: "0"         # 去掉 fbgemm.dll
      USE_MKLDNN: "0"         # 去掉 dnnl
      USE_NKL: "0"
      USE_ONNPACK: "0"
      USE_QNNPACK: "0"
      USE_PYTORCH_QNNPACK: "0"
      USE_KINETO: "0"         # 去掉 profiler
      USE_TENSORPIPE: "0"
      USE_OPENMP: "1"         # 小卷积保留 OpenMP, 足够用
      BUILD_TEST: "0"
      BUILD_PYTHON: "0"
      BUILD_SHARED_LIBS: "1"
      CMAKE_BUILD_TYPE: "Release"
      MAX_JOBS: "4"

    steps:
      - name: Checkout PyTorch source
        uses: actions/checkout@v4
        with:
          repository: pytorch/pytorch
          ref: ${{ github.event.inputs.pytorch_ref }}
          submodules: recursive
          path: pytorch

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Set up MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install build dependencies
        working-directory: pytorch
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyyaml typing_extensions ninja

      - name: Build libtorch (minimal)
        working-directory: pytorch
        run: |
          python tools/build_libtorch.py

      - name: List produced DLLs and sizes
        working-directory: pytorch
        shell: pwsh
        run: |
          Get-ChildItem build/lib/*.dll | 
            Select-Object Name, @{Name='MB';Expression={[math]::Round($_.Length/1MB,1)}} | 
            Sort-Object MB -Descending | Format-Table -AutoSize

      - name: Package libtorch (libs + headers)
        working-directory: pytorch
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist/libtorch/lib | Out-Null
          New-Item -ItemType Directory -Force -Path dist/libtorch/include | Out-Null
          Copy-Item build/lib/*.dll dist/libtorch/lib/ -Force
          Copy-Item build/lib/*.lib dist/libtorch/lib/ -Force
          # 头文件 torch C++ 前端 + ATen + c10
          Copy-Item -Recurse torch/include/* dist/libtorch/include/ -Force
          Compress-Archive -Path dist/libtorch/* -DestinationPath libtorch-min-win-cpu.zip -Force

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: libtorch-min-win-cpu
          path: pytorch/libtorch-min-win-cpu.zip
          retention-days: 14
