name: Build Super Light LibTorch (<30MB)

on:
  workflow_dispatch: # 网页端手动一键触发

jobs:
  build:
    runs-on: windows-2022

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Tools
      run: pip install pyyaml typing_extensions numpy

    - name: Clone PyTorch
      run: git clone --depth 1 --branch v2.4.1 https://github.com/pytorch/pytorch.git --recursive

    - name: Run Custom Crop Build (Direct CMake)
      shell: cmd
      run: |
        # 1. 创建并进入独立的编译目录
        mkdir build_dir
        cd build_dir
        
        # 2. 直接调用 CMake，强制注入所有极限瘦身参数（注意：Windows下换行用 ^）
        cmake -G "Ninja" ^
          -DCMAKE_BUILD_TYPE=Release ^
          -DBUILD_SHARED_LIBS=ON ^
          -DBUILD_TEST=OFF ^
          -DBUILD_PYTHON=OFF ^
          -DBUILD_CAFFE2=ON ^
          -DINTERN_BUILD_MOBILE=ON ^
          -DSELECTED_OP_LIST="${{ github.workspace }}\selected_operators.yaml" ^
          -DUSE_CUDA=OFF ^
          -DUSE_NUMPY=OFF ^
          -DUSE_OPENMP=OFF ^
          -DUSE_DISTRIBUTED=OFF ^
          -DUSE_TENSORPIPE=OFF ^
          -DUSE_GLOO=OFF ^
          -DUSE_MKL=OFF ^
          -DBLAS=Eigen ^
          -DBUILD_CUSTOM_PROTOBUF=ON ^
          ../pytorch

        # 3. 开始编译并执行安装
        cmake --build . --target install --config Release

    - name: Upload Custom LibTorch
      uses: actions/upload-artifact@v4
      with:
        name: ultra-small-libtorch
        path: pytorch/build/libtorch/
